# Магический шар. answers — случайный пул; usage/help — одиночные строки.
usage: "задай вопрос: .8ball <вопрос>"
help.long: |-
  .8ball <вопрос>
  магический шар отвечает да/нет
answers:
  # Утвердительные
  - "Бесспорно"
  - "Предрешено"
  - "Никаких сомнений"
  - "Определённо да"
  - "Можешь быть уверен в этом"
  - "Как я вижу, да"
  - "Скорее всего"
  - "Хорошие перспективы"
  - "Да"
  - "Знаки говорят — да"
  # Уклончивые
  - "Пока не ясно, попробуй снова"
  - "Спроси позже"
  - "Лучше не рассказывать сейчас"
  - "Сейчас нельзя предсказать"
  - "Сосредоточься и спроси опять"
  # Отрицательные
  - "Даже не надейся"
  - "Мой ответ — нет"
  - "По моим данным — нет"
  - "Перспективы не очень"
  - "Весьма сомнительно"

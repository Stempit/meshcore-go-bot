# Magic 8-Ball. answers is a random pool; usage/help are single strings.
usage: "ask a question: .8ball <question>"
help.long: |-
  .8ball <question>
  the magic ball answers yes/no
answers:
  # Affirmative
  - "It is certain"
  - "It is decidedly so"
  - "Without a doubt"
  - "Yes definitely"
  - "You may rely on it"
  - "As I see it, yes"
  - "Most likely"
  - "Outlook good"
  - "Yes"
  - "Signs point to yes"
  # Non-committal
  - "Reply hazy, try again"
  - "Ask again later"
  - "Better not tell you now"
  - "Cannot predict now"
  - "Concentrate and ask again"
  # Negative
  - "Don't count on it"
  - "My reply is no"
  - "My sources say no"
  - "Outlook not so good"
  - "Very doubtful"

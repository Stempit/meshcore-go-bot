# Случайный пул ответов на .ping. help.long — одиночная строка.
help.long: |-
  .ping — случайный понг
  также: ping, пинг
pool:
  - "Pong"
  - "Latency is high, please hold"
  - "Acknowledgment packet loss"
  - "200 OK"
  - "Понг"
  - "Я бы ответил, но у меня буферизация"
  - "Ваш запрос принят, ожидайте ответа. Или нет."
  - "Биииип"
  - "Вас слышно"
  - "Есть контакт"
  - "Ваш пинг достиг цели"
  - "(отвечает эхом) Пинг... Пинг... Пинг..."
  - "Связь есть"
  - "Есть связь"
  - "418"
  - "Есть сигнал, качество - как у любви в 16 лет"
  - "Понг, счет 15:40 в мою пользу"
  - "(стучит азбукой Морзе) .--. --- -. --."
  - "Ваш пинг успешно поставлен в очередь"
  - "А если не отвечу, пошлете еще один?"
  - "(ловит пакет и прячет под подушку)"
  - "502 Bad Gateway"
  - "Принял. Теперь нам с этим жить."
  - "Понг, последний предупредительный."
  - "(поднимает табличку \"PONG\" и прячется обратно в кусты)"
  - "Пинг принял, понг отправил"
  - "Есть сигнал, шумность - как у соседа с перфоратором"
  - "Принято, теперь он в коллекции \"1000 и 1 пинг\""
  - "(пересылает пинг кошке) Кошка сказала \"мяу\", что в переводе \"понг\""
  - "Понг. Но только половина. Остальное дойдет к утру."
  - "Пинг прошел через три стены, два репитера и одного кота. Ответ будет пушистым."
  - "Пинг успешно списан. Кэшбек - один понг."
  - "Ваш пинг прошел огонь, воду и медные трубы. Награда - понг."
  - "Ваш пинг выиграл в лотерею. Приз - понг."
  - "Пинг принят и отправлен на рецензию."
  - "Понг. Можете считать это официальным подтверждением."
  - "(смотрит на пинг, вздыхает) Ладно, понг."
  - "Пинг? В такое время? Ну понг, раз уж разбудили."
  - "Приложите пинг к заявлению в двух экземплярах."
  - "(шелестит бумагами) Ваш пинг зарегистрирован под номером... э... под номером."
  - "Ваш сигнал прошел контроль качества и одобрен."
  - "Пинг получен. Жалоб нет, претензий нет, понг отправлен."
  - "Радиоволны решили вас не подвести. На этот раз."
  - "Байты получены. Смысл — нет. Но это не важно."
  - "Я здесь. Вы тоже там? Прекрасно."
  - "Сигнал поймал на лету. Почти как покемон, только скучнее."
  - "Понг! Засчитан. Турнирная таблица обновлена."
  - "Ваш пинг путешествовал по эфиру и нашел меня. Трогательно."
  - "(пакет доставлен) Распишитесь вот здесь и вот тут..."
  - "Сигнал слышу. Интерференции минимум. Повезло нам обоим."
  - "Пинг прибыл. Ставлю печать и отправляю понг."
  - "TTL не истёк. Сегодня праздник."
  - "Пакет не потерян. Для нас тоже сюрприз."
  - "Пинг дошел через шум, помехи и чей-то микроволновый диапазон."
  - "Сигнал принят на всех диапазонах. И на нескольких лишних."
  - "(роняет антенну, поднимает) Ваш пинг? Принято."
  - "(протирает экран) Да, вижу вас. Понг."
  - "(записывает в блокнот) Пинг. Время. Дата. Настроение отправителя — неизвестно."
  - "Пинг? Это вы? Я вас сразу узнал."
  - "Ну наконец-то. Уже волновался."
  - "Пинг получен. Можете спать спокойно."
  - "Ваш пинг был лучшим сегодня. Не считая остальных."
  - "Пинг достиг цели. Цель удивлена."
  - "Пинг улетел в эфир и вернулся понгом. Как бумеранг, только цифровым."
  - "Принято! Сигнал упакован и отправлен обратно с наилучшими пожеланиями."
  - "Если пинг никто не слышит — это всё равно пинг. Но мы услышали."
  - "Что такое пинг? Крик в пустоте. Я — ответ этой пустоты."
  - "Понг отправлен. Путь неизвестен. Судьба туманна. Связь есть."
  - "Пинг зафиксирован приборами. Все приборы сказали «ну и ладно»."
  - "Ваш пинг прошел проверку на подлинность. Настоящий."
  - "Понг. Без объяснений. Просто понг."
  - "Ваш пинг был своевременным. Спасибо за пунктуальность."
  - "Пинг получен. Понг отправлен. Отчёт подан. Все свободны."
  - "Сигнал слабый, но гордый. Дошёл."
  - "Ретрансляция завершена успешно. Узлы довольны."
  - "Пинг — это как стук в дверь. Я открыл. Понг."
  - "Сеть живёт. Доказательство — этот понг."
  - "(смахивает пыль с приёмника) О, пинг! Давненько не виделись."
  - "Пинг принят. Теперь мы оба знаем, что живы."
  - "Связь установлена."
  - "Понг. Коротко и ясно, как и должно быть."
  - "По факту пинга составлен акт в трёх экземплярах. Один вам."
  - "Понг выдан на основании поданного пинга. Сохраните квитанцию."
  - "Ваш пинг направлен на согласование и одобрен в рекордные сроки."
  - "Пинг? Нет, показалось. Хотя нет — пинг. Понг."
  - "Сеть не упала. Вы не упали. Отличный день."

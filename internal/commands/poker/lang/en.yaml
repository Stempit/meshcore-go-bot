# .poker — fixed-limit Hold'em. Templates are positional (%s/%d); argument
# order is fixed. All single-line templates stay ≤130 bytes with worst-case
# arguments (enforced by tests).
help.long: |-
  .poker — Texas Hold'em (fixed limit)
  .poker start — open a table, .poker join — sit
  .poker leave / end / top — table controls
  Actions in DM: call / raise / fold
usage: ".poker [start|join|leave|end|top]; actions in DM"
discovery: "♠️ Poker at this channel! .poker start to open (2–6)."
table_open: "♠️ Table open! .poker join — deal in %ds."

# .poker — лимитный холдем. Шаблоны позиционные (%s/%d), порядок аргументов
# фиксирован. Все однострочные шаблоны ≤130 байт при худших аргументах
# (проверяется тестами).
help.long: |-
  .poker — техасский холдем (лимитный)
  .poker start — открыть стол, .poker join — сесть
  .poker leave / end / top — управление столом
  Ходы — в личке бота: call / raise / fold
usage: ".poker [start|join|leave|end|top]; ходы — в личке"

---
Connection:
  # Transport type: "bt" (Bluetooth LE, default) or "serial" (USB/UART)
  type: bt
  # serial_port is required when type is "serial"
  # Linux:   /dev/ttyUSB0  or  /dev/ttyACM0
  # macOS:   /dev/tty.usbmodem14101
  # Windows: COM3
  # serial_port: /dev/ttyUSB0
  # serial_baud: 115200   # default 115200, matches MeshCore firmware
  # Maximum number of times to transmit each channel reply. Channel messages
  # have no delivery ACK and the device can silently drop a queued packet, so
  # the bot may send the same packet a few times (receivers dedup it) to improve
  # reliability. It stops early as soon as it hears the mesh rebroadcast the
  # message, so on a healthy network fewer transmissions are sent. This is our
  # node transmitting, not the network "repeat" by repeater nodes. Default 3;
  # set to 1 for a single transmission.
  # channel_transmissions: 3

Proxy:
  enabled: false
  url: "socks5://user:pass@host:1080"  # proxy for Telegram and OpenRouter

MQTT:
  # common mqtt config
  iata: KVX               # region by iata
  status_enabled: true    # send status updates
  packets_enabled: true   # send incoming packets
  tx_enabled: true        # send outgoing packets
  status_interval: 50000  # ms
  adverts_enabled: true
  messages_enabled: true
  channel_msgs_enabled: true
  delivery_enabled: true
  path_updates_enabled: true

  # old mqtt server (tcp)
  server: meshcoretel.ru
  port: 1883
  username: meshcore
  password: meshcore
  
  # new mqtt servers by let's mesh (websocket)
  analyzer_eu: true  # send to EU analyzer  
  analyzer_us: true  # send to US analyzer
  owner_email: your@email.here
  device_private_key: "SECRET"  # 128 symbols device private key for JWT

LLM:
  enabled: true
  # type: ollama
  # model: phi4-mini:3.8b
  type: openrouter
  model: openai/gpt-4.1-nano
  system_prompt: >
    Ты - чатбот. Отвечай серьезно на серьезные вопросы, шутливо на шутливые. Отвечай на том же языке, на котором был задан вопрос. Нельзя использовать markdown или любое другое форматирование. Не задавай вопросов. Только отвечай. Коротко и по существу.
  system_temperature: 0.5
  shrink_prompt: >
    Сделай текст еще короче. Результат - не более 130 байт (около 60-70 символов). Ответ - не более 10 слов. Одной строчкой. Без форматирования. Одно предложение, до первой точки. Нельзя возвращать тот же текст, обязательно сократи и измени текст. Формат SMS.
  shrink_temperature: 0.7
  shrink_max_reties: 5

Telegram:
  enabled: true
  bot_token: "123456:ABC-DEF..."
  # sources: Telegram → MeshCore (forward Telegram messages into a mesh channel)
  sources:
    - type: channel
      chat_id: -1001234567890     # Telegram channel ID (negative)
      mesh_channel_name: "#tg1"
      shrink: true
    - type: group_thread
      chat_id: -1001234567890     # public group ID (negative)
      thread_id: 2                # topic/thread ID (message_id of the topic root)
      mesh_channel_name: "#tg2"
      shrink: true
  # targets: MeshCore → Telegram (forward mesh channel messages into Telegram)
  targets:
    - mesh_channel_name: "Public"   # meshcore channel name to listen on
      chat_id: -1001234567890          # Telegram channel or group to post to
    - mesh_channel_name: "Public"   # same mesh channel → different group thread
      chat_id: -1009876543210
      thread_id: 5                     # topic/thread ID (0 or omit = no thread)

RSS:
  enabled: true
  long_title: skip       # "skip" – drop titles >140 chars; "shrink" – compress via LLM
  seen_file: log/rss_seen.txt   # omit to use this default path
  feeds:
    - name: "habr"
      url: https://habr.com/ru/rss/news/rated0/?fl=ru
      interval: 5m
    - name: "ixbt"
      url: https://www.ixbt.com/export/news.rss
      interval: 5m
    - name: "rbc"
      url: https://rssexport.rbc.ru/rbcnews/news/30/full.rss
      interval: 5m

Weather:
  enabled: true
  default_location: "Moscow"  # used when .w is called with no argument
  units: metric               # metric (°C, m/s) or imperial (°F, mph)

Trace:
  use_config_coords: false  # использование предзаданных координат
  lat: 0
  lon: 0

Claw:
  enabled: false
  url: "ws://localhost:18790/pico/ws"  # picoclaw gateway directly (NOT port 18800 dashboard)
  token: "your-pico-token"            # from picoclaw dashboard → Pico channel token
  timeout_sec: 180
  bot_name: "Yorick 💀"               # mesh display name; @[bot_name] messages are routed to picoclaw
  split: true                         # split long responses into numbered mesh messages [1/N] instead of LLM shrink

Security:
  channels:
    whitelist: []          # empty = allow all (unless blacklisted)
    blacklist: ["OffLimits"]
  direct:
    whitelist: ["deadbeef1234..."]  # non-empty = only these keys
    blacklist: []

Stats:
  # URL for the Let's Mesh edge-stats API (or a local snapshot for testing).
  # HTTP/HTTPS example: https://api-eu-v1.letsmesh.net/stats/edges?token=YOUR_TOKEN
  # Local file example: file:///home/pi/meshbot/stats.json
  url: ""
  cache_ttl_sec: 300  # refresh interval; 0 = use default 5 min

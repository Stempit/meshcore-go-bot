---
MQTT:
  # common mqtt config
  origin: <devicename>    # yours device name
  iata: KVX               # region by iata
  status_enabled: true    # send status updates
  packets_enabled: true   # send incoming packets
  tx_enabled: true        # send outgoing packets
  status_interval: 50000  # ms
  adverts_enabled: true
  messages_enabled: true
  channel_msgs_enabled: true
  delivery_enabled: true
  path_updates_enabled: true

  # old mqtt server (tcp)
  server: meshcoretel.ru
  port: 1883
  username: meshcore
  password: meshcore
  
  # new mqtt servers by let's mesh (websocket)
  analyzer_eu: true  # send to EU analyzer  
  analyzer_us: true  # send to US analyzer
  owner_email: your@email.here
  device_private_key: "SECRET"  # 128 symbols device private key for JWT

LLM:
  enabled: true
  # type: ollama
  # model: phi4-mini:3.8b
  type: openrouter
  model: openai/gpt-4.1-nano
  system_prompt: >
    Ты - чатбот. Отвечай серьезно на серьезные вопросы, шутливо на шутливые. Отвечай на том же языке, на котором был задан вопрос. Нельзя использовать markdown или любое другое форматирование. Не задавай вопросов. Только отвечай. Коротко и по существу.
  system_temperature: 0.5
  shrink_prompt: >
    Сделай текст еще короче. Результат - не более 130 символов, включая пробелы. Ответ - не более 10 слов. Одной строчкой. Без форматирования. Одно предложение, до первой точки. Нельзя возвращать тот же текст, обязательно сократи и измени текст. Формат SMS.
  shrink_temperature: 0.7
  shrink_max_reties: 5

Telegram:
  enabled: true
  bot_token: "123456:ABC-DEF..."
  sources:
    - type: channel
      chat_id: -1001234567890     # Telegram channel ID (negative)
      mesh_channel_name: "#tg1"
      shrink: true
    - type: group_thread
      chat_id: -1001234567890     # public group ID (negative) 1002741904113
      thread_id: 2                # topic/thread ID (message_id of the topic root)
      mesh_channel_name: "#tg2"
      shrink: true

Trace:
  use_config_coords: false  # использование предзаданных координат
  lat: 0
  lon: 0

Security:
  channels:
    whitelist: []          # empty = allow all (unless blacklisted)
    blacklist: ["OffLimits"]
  direct:
    whitelist: ["deadbeef1234..."]  # non-empty = only these keys
    blacklist: []

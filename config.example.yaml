---
# Bot-wide UI language for command replies and help text: "en" or "ru".
# Empty/omitted defaults to "en". Commands not yet migrated to i18n keep their
# own hardcoded text regardless of this setting. Restart to apply.
Language: ru

Connection:
  # Transport type: "bt" (Bluetooth LE, default) or "serial" (USB/UART)
  type: bt
  # serial_port is required when type is "serial"
  # Linux:   /dev/ttyUSB0  or  /dev/ttyACM0
  # macOS:   /dev/tty.usbmodem14101
  # Windows: COM3
  # serial_port: /dev/ttyUSB0
  # serial_baud: 115200   # default 115200, matches MeshCore firmware
  # Maximum number of times to transmit each channel reply. Channel messages
  # have no delivery ACK and the device can silently drop a queued packet, so
  # the bot may send the same packet a few times (receivers dedup it) to improve
  # reliability. It stops early as soon as it hears the mesh rebroadcast the
  # message, so on a healthy network fewer transmissions are sent. This is our
  # node transmitting, not the network "repeat" by repeater nodes. Default 3;
  # set to 1 for a single transmission.
  # channel_transmissions: 3

Proxy:
  enabled: false
  url: "socks5://user:pass@host:1080"  # proxy for Telegram and OpenRouter

MQTT:
  # common mqtt config
  iata: KVX               # region by iata
  status_enabled: true    # send status updates
  packets_enabled: true   # publish received packets (packets topic)
  tx_enabled: true        # mirror own outgoing messages to MQTT (as emulated rx)
  raw_enabled: false      # also publish minimal raw packets to analyzer servers
  status_interval: 50000  # ms
  publish_channel_keys: false  # DANGEROUS: adds channel_key (the channel PSK,
                               # which decrypts all its traffic) to published
                               # packets. Only enable for channels you accept
                               # making public to the analyzer operators.

  # old mqtt server (tcp)
  server: meshcoretel.ru
  port: 1883
  username: meshcore
  password: meshcore
  
  # new mqtt servers by let's mesh (websocket)
  analyzer_eu: true  # send to EU analyzer  
  analyzer_us: true  # send to US analyzer
  owner_email: your@email.here
  device_private_key: "SECRET"  # 128 symbols device private key for JWT

LLM:
  enabled: true
  # type: ollama
  # model: phi4-mini:3.8b
  type: openrouter
  model: openai/gpt-4.1-nano
  system_prompt: >
    Ты - чатбот. Отвечай серьезно на серьезные вопросы, шутливо на шутливые. Отвечай на том же языке, на котором был задан вопрос. Нельзя использовать markdown или любое другое форматирование. Не задавай вопросов. Только отвечай. Коротко и по существу.
  system_temperature: 0.5

# Shrink: how replies are fitted into the 140-byte mesh limit. See docs/SHRINK.md.
Shrink:
  default: llm            # variant for any name without an override: truncate|split|llm|skip
  max_bytes: 140          # hard mesh limit
  ellipsis: "…"           # appended by truncate
  cyr_to_lat: true        # lossless: swap Cyrillic letters for identical-looking ASCII (saves 1 byte each)
  overrides:              # per-command/source variant override
    news: skip            # drop news items that don't fit
    last: truncate        # history lines: cut, don't LLM-shrink
    agent: split          # AI agent replies: numbered [i/N] parts
    bbs: split            # BBS posts must stay verbatim
    telegram: split       # bridged Telegram messages
  llm:                    # the "llm" variant (uses a light model to compress)
    # type: ollama        # optional; inherits LLM.type when empty
    # model: phi4-mini:3.8b  # optional; inherits LLM.model when empty
    prompt: >
      Сделай текст еще короче. Результат - не более 130 байт (около 60-70 символов). Ответ - не более 10 слов. Одной строчкой. Без форматирования. Одно предложение, до первой точки. Нельзя возвращать тот же текст, обязательно сократи и измени текст. Формат SMS.
    temperature: 0.7
    max_retries: 5

Telegram:
  enabled: true
  bot_token: "123456:ABC-DEF..."
  # sources: Telegram → MeshCore (forward Telegram messages into a mesh channel)
  sources:
    - type: channel
      chat_id: -1001234567890     # Telegram channel ID (negative)
      mesh_channel_name: "#tg1"
    - type: group_thread
      chat_id: -1001234567890     # public group ID (negative)
      thread_id: 2                # topic/thread ID (message_id of the topic root)
      mesh_channel_name: "#tg2"
  # targets: MeshCore → Telegram (forward mesh channel messages into Telegram)
  targets:
    - mesh_channel_name: "Public"   # meshcore channel name to listen on
      chat_id: -1001234567890          # Telegram channel or group to post to
    - mesh_channel_name: "Public"   # same mesh channel → different group thread
      chat_id: -1009876543210
      thread_id: 5                     # topic/thread ID (0 or omit = no thread)

Weather:
  enabled: true
  default_location: "Moscow"  # used when .w is called with no argument
  units: metric               # metric (°C, m/s) or imperial (°F, mph)

Alerts:
  sources:
    - enabled: false
      name: bpla                 # used for logging and the seen-ids file (log/alerts/bpla.txt)
      type: html_cards           # bplarussia.ru-style incident cards
      url: "https://bplarussia.ru/region/kirovskaya-oblast"
      channel: "#alerts"         # must already exist as a MeshCore channel on the device
      poll_interval_sec: 60
      max_per_poll: 3            # cap on new items announced per poll, to avoid flooding after downtime
      postfix: " #БПЛА"          # optional: appended as-is to the announced message text
    - enabled: false
      name: mchs
      type: rss
      url: "https://43.mchs.gov.ru/deyatelnost/press-centr/operativnaya-informaciya/rss"
      channel: "#alerts"
      poll_interval_sec: 300
      max_per_poll: 3
      title_prefix: "Внимание"   # only forward genuine hazard warnings, skip routine daily reports
      postfix: " #МЧС"

Trace:
  use_config_coords: false  # использование предзаданных координат
  lat: 0
  lon: 0

Agent:
  enabled: false                    # false hides .agent and @[bot_name] mentions from routing and help
  type: openai                      # openai (default) | picoclaw
  url: "http://127.0.0.1:8900"      # openai: agent base URL; picoclaw: ws://host:18790/pico/ws (NOT port 18800 dashboard)
  token: ""                         # bearer token (nanobot: NANOBOT_API_KEY); empty = keyless local server
  model: ""                         # openai only; empty = agent's own default (nanobot takes it from config.json)
  timeout_sec: 180                  # agent runs with tools can be slow
  bot_name: "Yorick 💀"             # mesh display name; @[bot_name] messages are routed to the agent
  # mesh-fit variant for .agent replies is set in Shrink.overrides (default: split)

Security:
  channels:
    whitelist: []          # empty = allow all (unless blacklisted)
    blacklist: ["OffLimits"]
  direct:
    whitelist: ["deadbeef1234..."]  # non-empty = only these keys
    blacklist: []

Redirect:
  # Steer flood-prone commands off busy channels: when a listed command arrives
  # on a listed channel, the bot replies with the rule's message instead of
  # running the command. DMs are never redirected. Commands are matched by their
  # canonical name (the same names shown in .help / the command table).
  enabled: false
  cooldown_seconds: 60   # min seconds between identical notices per channel; 0 = no throttle
  rules:
    - on: ["Public"]                 # channels where the rule applies; empty = all channels
      commands: [ping, trace]
      message: "→ #ping-pong 🏓"
    - on: ["Public"]
      commands: [dice, num, hang, words, "8ball"]
      message: "Игры → #games 🎮"

Stats:
  # URL for the Let's Mesh edge-stats API (or a local snapshot for testing).
  # HTTP/HTTPS example: https://api-eu-v1.letsmesh.net/stats/edges?token=YOUR_TOKEN
  # Local file example: file:///home/pi/meshbot/stats.json
  url: ""
  cache_ttl_sec: 300  # refresh interval; 0 = use default 5 min

Migration:
  # Nudge nodes still routing with 1-byte path hashes to switch to 2-byte.
  # When a received advert or public-channel message reveals 1-byte routing,
  # the bot posts the reminder on that channel, at most once per cooldown per node.
  # Detection needs real hops in the path; direct/flood packets carry no hash info.
  enabled: false
  message: "switch to 2-byte please"
  cooldown_sec: 86400  # min gap between warnings to the same node; 0 = default 24h

Top:
  # ".top" ranks the most active authors in the channel where it was called.
  # scan_count is how many of the most recent (non-bot) channel messages are
  # scanned before tallying authors; 0 or unset = default 100.
  scan_count: 100

words:
  # ".words" — timed anagram game ("Слова из слова"). Opt-in: stays off until
  # enabled. Both dictionaries are embedded in the binary (no runtime file
  # needed); the one loaded at startup follows the top-level Language setting
  # (ru = Russian nouns, otherwise English).
  enabled: false
  round_sec: 300     # countdown length per round; 0 or unset = default 300 (5 min)
  min_sub_len: 3     # shortest valid submission in letters; 0/unset = default 3
  base_min_len: 8    # shortest base word in letters; 0/unset = default 8
  base_max_len: 10   # longest base word in letters; 0/unset = default 10
  # To wrap (rather than truncate) an overlong results line, add:
  #   Shrink.overrides.words: split

vote:
  # ".vote" — a per-channel group poll: open with a question and options, each
  # sender gets one changeable, anonymous vote, results auto-post when the timer
  # fires or anyone runs ".vote end". Channels only. Opt-in: stays off until
  # enabled.
  enabled: false
  round_sec: 180     # auto-close countdown per poll; 0 or unset = default 180 (3 min)
  max_options: 6     # max options per poll; 0 or unset = default 6
  # The results list is multi-line; to wrap (rather than truncate) it, add:
  #   Shrink.overrides.vote: split

poker:
  # ".poker" — fixed-limit Texas Hold'em on a channel (2–6 players). The
  # channel carries dealer commentary only (deals, betting news, streets,
  # results); every betting action happens in the bot's DMs, where players
  # also receive hole cards and a personal event log. Turn prompts are
  # dynamic and priced ("call 10 / raise до 20 / fold"). Opt-in: stays off
  # until enabled.
  enabled: false
  starting_stack: 200     # chips per player; 0/unset = default 200
  small_bet: 10           # bet size preflop/flop (blinds are small_bet/2 and small_bet); default 10
  big_bet: 20             # bet size turn/river; default 20
  max_raises: 3           # raises per street; default 3
  max_players: 6          # table size, 2–6; default 6
  join_sec: 60            # join window after .poker start; default 60
  turn_timeout_sec: 90    # auto check-else-fold per turn; default 90
  deal_pause_sec: 20      # join window between hands; default 20
  idle_timeout_sec: 900   # idle table close; default 900 (15 min)
